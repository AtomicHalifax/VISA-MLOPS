[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visa-mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline for Visa approval prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "pyyaml",
    "joblib",
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]